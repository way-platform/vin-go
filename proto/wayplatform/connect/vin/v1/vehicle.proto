edition = "2023";

package wayplatform.connect.vin.v1;

import "wayplatform/connect/vin/v1/brand.proto";
import "wayplatform/connect/vin/v1/data_source.proto";
import "wayplatform/connect/vin/v1/fuel_type.proto";
import "wayplatform/connect/vin/v1/model.proto";
import "wayplatform/connect/vin/v1/vehicle_type.proto";

// A vehicle.
message Vehicle {
  // The vehicle's brand.
  Brand brand = 1;

  // The vehicle's type.
  VehicleType type = 2;

  // The vehicle's model.
  Model model = 3;

  // The vehicle's model year.
  int32 model_year = 4;

  // The vehicle's fuel types.
  repeated FuelType fuel_types = 5;

  // The vehicle's axle count.
  int32 axle_count = 6;

  // The data sources for the vehicle.
  repeated DataSource data_sources = 7;

  // Fuel tank capacity in liters. Best-effort value based on the decoded VIN
  // and available reference data. Zero when unknown or not applicable (BEVs).
  double fuel_tank_capacity_l = 8;

  // Battery capacity in kilowatt-hours. Best-effort value based on the decoded
  // VIN and available reference data. Zero when unknown or not applicable
  // (pure ICE vehicles).
  double battery_capacity_kwh = 9;
}
