version: "2"

linters:
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # Pre-existing integer conversions; values are format-bounded.
        - G115

  exclusions:
    rules:
      # Test files: test file I/O patterns are not vulnerabilities.
      - path: "_test\\.go"
        linters:
          - gosec
        text: "G101|G304|G306"
      # Tool commands: file I/O patterns in code generators are not vulnerabilities.
      - path: "tools/cmd/"
        linters:
          - errcheck
      - path: "tools/cmd/"
        linters:
          - gosec
        text: "G104|G304|G306|G703|G706"
      # CLI dev server: XSS taint and no-timeout are acceptable for localhost-only tool.
      - path: "cli/"
        linters:
          - gosec
        text: "G114|G705"
      # defer f.Close() in tool commands — error is unactionable in a defer context.
      - path: "tools/cmd/"
        linters:
          - errcheck
        text: "\\.Close"
